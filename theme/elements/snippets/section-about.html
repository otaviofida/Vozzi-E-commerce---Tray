<section class="s-about">
    <div class="container">
        <div class="s-about__wrapper">
            <div class="s-about__media">
                {% if settings.section_about_img %}
                <img src="{{ asset(settings.section_about_img) }}" alt="Sobre a Vozzi" loading="lazy" width="600"
                    height="500">
                {% endif %}
                <div class="s-about__media-overlay"></div>
            </div>
            <div class="s-about__content">
                <span class="s-about__label">Sobre nós</span>
                <h2>Conheça a Vozzi</h2>
                <p>Estilo e funcionalidade andando juntos. Mais do que proteger, nossos produtos refletem sua
                    personalidade e trazem praticidade para o seu dia a dia.</p>
                <a href="/sobre-a-vozzi" class="s-about__btn">
                    Saiba mais
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12" />
                        <polyline points="12 5 19 12 12 19" />
                    </svg>
                </a>
            </div>
        </div>
    </div>
</section>
